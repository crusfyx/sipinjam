<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIPINJAM — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="topbar">
  <div class="logo">SI<span>PINJAM</span> <span style="font-size:13px;color:var(--muted);font-family:'DM Sans';font-weight:300;letter-spacing:0">— Admin</span></div>
  <div class="topbar-right">
    <div class="stat-pill"><div class="dot dot-pending"></div><span id="cnt-pending">—</span> Pending</div>
    <div class="stat-pill"><div class="dot dot-approved"></div><span id="cnt-approved">—</span> Disetujui</div>
    <div class="stat-pill"><div class="dot dot-rejected"></div><span id="cnt-rejected">—</span> Ditolak</div>
  </div>
</div>

<div class="filter-bar">
  <button class="filter-btn active" onclick="setFilter('Semua', this)">SEMUA</button>
  <button class="filter-btn" onclick="setFilter('Pending', this)">PENDING</button>
  <button class="filter-btn" onclick="setFilter('Disetujui', this)">DISETUJUI</button>
  <button class="filter-btn" onclick="setFilter('Ditolak', this)">DITOLAK</button>
  <button class="filter-btn" onclick="setFilter('Selesai', this)">SELESAI</button>
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <circle cx="6" cy="6" r="4.5" stroke="white" stroke-width="1.3"/>
      <path d="M9.5 9.5L12 12" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Cari nama / kendaraan..." oninput="renderTable()">
  </div>
</div>

<div class="last-refresh" id="lastRefresh"></div>

<div class="table-wrap">
  <div class="loading" id="loadingState">MEMUAT DATA...</div>
  <table id="mainTable" style="display:none">
    <thead>
      <tr>
        <th>#</th>
        <th>NAMA / NIP</th>
        <th>KENDARAAN</th>
        <th>WAKTU</th>
        <th>TUJUAN / KEPERLUAN</th>
        <th>STATUS</th>
        <th>AKSI</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="empty" id="emptyState" style="display:none">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
      <rect x="8" y="12" width="32" height="28" rx="3" stroke="white" stroke-width="2"/>
      <path d="M16 20h16M16 28h10" stroke="white" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div>Tidak ada pengajuan ditemukan</div>
  </div>
</div>

<div class="toast" id="toast">
  <div class="toast-icon" id="toastIcon">✓</div>
  <div id="toastMsg">—</div>
</div>

<script>
// ══════════════════════════════════════════════════════
// SUPABASE CONFIG — sama dengan index.html
// ══════════════════════════════════════════════════════
const SUPABASE_URL = 'https://mjlkrhqndhvfogrqzksx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_p0JUgSQQFDE3I14pK53mOg_2YXf050m';

const HEADERS = {
  'apikey':        SUPABASE_KEY,
  'Authorization': `Bearer ${SUPABASE_KEY}`,
  'Content-Type':  'application/json'
};

let allData    = [];
let activeFilter = 'Semua';

// ── FETCH ALL BOOKINGS ──────────────────────────────
async function fetchBookings() {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/bookings?order=timestamp.desc&select=*`,
    { headers: HEADERS }
  );
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ── UPDATE STATUS ───────────────────────────────────
async function updateStatus(id, status) {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/bookings?id=eq.${id}`,
    {
      method: 'PATCH',
      headers: { ...HEADERS, 'Prefer': 'return=minimal' },
      body: JSON.stringify({ status })
    }
  );
  if (!res.ok) throw new Error(await res.text());
}

// ── FORMAT HELPERS ──────────────────────────────────
function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
}
function fmtTs(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function badgeHtml(status) {
  const map = {
    'Pending':   ['badge-pending',  '●'],
    'Disetujui': ['badge-approved', '✓'],
    'Ditolak':   ['badge-rejected', '✕'],
    'Selesai':   ['badge-done',     '■'],
  };
  const [cls, icon] = map[status] || ['badge-pending', '●'];
  return `<span class="badge ${cls}">${icon} ${status}</span>`;
}
function actionsHtml(row) {
  if (row.status === 'Pending') {
    return `
      <div class="actions">
        <button class="btn-acc"   onclick="doAction(${row.id},'Disetujui')">✓ Setujui</button>
        <button class="btn-tolak" onclick="doAction(${row.id},'Ditolak')">✕ Tolak</button>
      </div>`;
  }
  if (row.status === 'Disetujui') {
    return `
      <div class="actions">
        <button class="btn-selesai" onclick="doAction(${row.id},'Selesai')">■ Selesai</button>
        <button class="btn-tolak"   onclick="doAction(${row.id},'Ditolak')">✕ Tolak</button>
      </div>`;
  }
  return `<div class="actions"><span style="font-size:11px;color:var(--muted);font-family:'DM Mono'">—</span></div>`;
}

// ── RENDER TABLE ────────────────────────────────────
function renderTable() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let rows = allData;

  if (activeFilter !== 'Semua') {
    rows = rows.filter(r => r.status === activeFilter);
  }
  if (q) {
    rows = rows.filter(r =>
      (r.nama       || '').toLowerCase().includes(q) ||
      (r.kendaraan  || '').toLowerCase().includes(q) ||
      (r.plat       || '').toLowerCase().includes(q) ||
      (r.seksi      || '').toLowerCase().includes(q) ||
      (r.tujuan     || '').toLowerCase().includes(q)
    );
  }

  const tbody = document.getElementById('tableBody');
  if (rows.length === 0) {
    document.getElementById('mainTable').style.display = 'none';
    document.getElementById('emptyState').style.display = 'block';
    return;
  }
  document.getElementById('mainTable').style.display = 'table';
  document.getElementById('emptyState').style.display = 'none';

  tbody.innerHTML = rows.map((r, i) => `
    <tr id="row-${r.id}">
      <td class="td-no">${i + 1}</td>
      <td class="td-nama">
        <strong>${r.nama || '—'}</strong>
        <span>${r.nip || ''} · ${r.seksi || ''}</span>
      </td>
      <td class="td-kendaraan">
        <strong>${r.kendaraan || '—'}</strong>
        <span>${r.plat || ''}</span>
      </td>
      <td class="td-waktu">
        <strong>${fmtDate(r.tanggal)}</strong>
        ${r.jam_mulai || '?'} – ${r.jam_selesai || '?'}
        <br><span style="font-size:10px;opacity:.5">${fmtTs(r.timestamp)}</span>
      </td>
      <td class="td-tujuan">
        <div>${r.tujuan || '—'}</div>
        <div class="keperluan">${r.keperluan || ''}</div>
      </td>
      <td>${badgeHtml(r.status)}</td>
      <td>${actionsHtml(r)}</td>
    </tr>
  `).join('');
}

// ── UPDATE COUNTS ────────────────────────────────────
function updateCounts() {
  document.getElementById('cnt-pending').textContent  = allData.filter(r => r.status === 'Pending').length;
  document.getElementById('cnt-approved').textContent = allData.filter(r => r.status === 'Disetujui').length;
  document.getElementById('cnt-rejected').textContent = allData.filter(r => r.status === 'Ditolak').length;
}

// ── ACTION ───────────────────────────────────────────
async function doAction(id, status) {
  const row = document.getElementById(`row-${id}`);
  if (row) row.style.opacity = '0.4';

  try {
    await updateStatus(id, status);
    const idx = allData.findIndex(r => r.id === id);
    if (idx > -1) allData[idx].status = status;
    updateCounts();
    renderTable();
    showToast(
      status === 'Disetujui' ? '✓' : status === 'Ditolak' ? '✕' : '■',
      `Pengajuan ${status === 'Disetujui' ? 'disetujui' : status === 'Ditolak' ? 'ditolak' : 'ditandai selesai'}`
    );
  } catch (e) {
    if (row) row.style.opacity = '1';
    showToast('!', 'Gagal: ' + e.message);
  }
}

// ── FILTER ───────────────────────────────────────────
function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.remove('active', 'active-green');
  });
  btn.classList.add('active');
  renderTable();
}

// ── TOAST ────────────────────────────────────────────
function showToast(icon, msg) {
  document.getElementById('toastIcon').textContent = icon;
  document.getElementById('toastMsg').textContent  = msg;
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── LOAD ─────────────────────────────────────────────
async function load() {
  try {
    allData = await fetchBookings();
    document.getElementById('loadingState').style.display = 'none';
    updateCounts();
    renderTable();
    document.getElementById('lastRefresh').textContent =
      'Terakhir diperbarui: ' + new Date().toLocaleTimeString('id-ID');
  } catch (e) {
    document.getElementById('loadingState').textContent = 'Gagal memuat: ' + e.message;
  }
}

// ── GRANT UPDATE untuk anon (jalankan SQL ini di Supabase jika belum):
// GRANT UPDATE ON public.bookings TO anon;
// ─────────────────────────────────────────

load();
// Auto-refresh tiap 30 detik
setInterval(load, 30000);
</script>
</body>
</html>
